<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>PokeVault</title>
    <script>
      // SPA redirect for GitHub Pages — encodes the path as a query param so
      // the server returns index.html, then index.html restores the real URL.
      // pathSegmentsToKeep=1 handles the /pokevault/ repo subpath.
      var pathSegmentsToKeep = 1;
      var l = window.location;
      l.replace(
        l.protocol + '//' + l.hostname + (l.port ? ':' + l.port : '') +
        l.pathname.split('/').slice(0, 1 + pathSegmentsToKeep).join('/') + '/?/' +
        l.pathname.slice(1).split('/').slice(pathSegmentsToKeep).join('/').replace(/&/g, '~and~') +
        (l.search ? '&' + l.search.slice(1).replace(/&/g, '~and~') : '') +
        l.hash
      );
    </script>
  </head>
  <body></body>
</html>
